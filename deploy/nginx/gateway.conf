# DevPulse Edge Reverse Proxy Gateway Configuration

upstream backend_upstream {
    server devpulse-backend:5000;
}

upstream frontend_upstream {
    server devpulse-frontend:80;
}

# HTTP Server Block (Port 80)
# Handles ACME challenges for Let's Encrypt and redirects all web traffic to canonical HTTPS domain
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ devpulse.dorayakiiiiz.site;

    # Let's Encrypt ACME challenge webroot for automated renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check probe endpoint for local deployment verification
    location = /api/health {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Permanent 301 redirect to canonical HTTPS domain
    location / {
        return 301 https://devpulse.dorayakiiiiz.site$request_uri;
    }
}

# HTTPS Server Block (Port 443)
# Production TLS termination for devpulse.dorayakiiiiz.site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devpulse.dorayakiiiiz.site;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/devpulse.dorayakiiiiz.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devpulse.dorayakiiiiz.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Global security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Gzip dynamic and static proxy content
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Server-Sent Events (SSE) streaming endpoint
    location /api/sse/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Disable buffering, compression, and caching for instant real-time event streaming
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API endpoints
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Frontend React SPA
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
