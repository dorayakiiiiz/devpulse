name: DevPulse CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ========================================================
  # JOB 1: BACKEND QUALITY GATE (Type-Check & 59 Tests)
  # ========================================================
  backend-quality-gate:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Strict TypeScript Compilation Check
        working-directory: backend
        run: npm run type-check

      - name: Run Backend Tests
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/devpulse_test
          JWT_SECRET: devpulse_test_jwt_secret_key_super_secure_32_chars
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: devpulse_test_jwt_refresh_secret_key_super_secure_32_chars
          JWT_REFRESH_EXPIRES_IN: 7d
        run: npm test

      - name: Verify Backend TypeScript Build
        working-directory: backend
        run: npm run build

  # ========================================================
  # JOB 2: FRONTEND QUALITY GATE (Type-Check, 59 Tests & Build)
  # ========================================================
  frontend-quality-gate:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Strict TypeScript Compilation Check
        working-directory: frontend
        run: npm run type-check

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Verify Production Bundle Build
        working-directory: frontend
        run: npm run build

  # ========================================================
  # JOB 3: BUILD & PUSH DOCKER IMAGES (Only on merge to main)
  # ========================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: [ backend-quality-gate, frontend-quality-gate ]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devpulse-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devpulse-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devpulse-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devpulse-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ========================================================
  # JOB 4: DEPLOY TO VPS (Only on merge to main)
  # ========================================================
  deploy-vps:
    name: Deploy to Production VPS
    needs: [ build-and-push ]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Copy Compose and Nginx Configurations to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml,deploy/nginx/gateway.conf"
          target: "~/devpulse"
          strip_components: 0

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_TAG
          script: |
            set -e
            cd ~/devpulse

            # Authenticate to Docker Hub on VPS to pull private images and bypass 429 rate limits
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Pull exact commit-pinned container images from Docker Hub
            docker compose -f docker-compose.prod.yml pull

            # Recreate containers with zero downtime
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Validate and reload Nginx gateway so bind-mounted gateway.conf updates apply immediately
            docker exec devpulse-gateway nginx -t
            docker exec devpulse-gateway nginx -s reload

            # Clean up dangling layers to prevent SSD bloat
            docker image prune -f

            # Verify container health
            echo "[CD] Verifying service health..."
            sleep 10
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            if ! curl -f http://localhost/api/health; then
              echo "[CD Error] Gateway / Backend health probe failed!"
              exit 1
            fi
            echo "[CD] DevPulse production deployment succeeded!"

