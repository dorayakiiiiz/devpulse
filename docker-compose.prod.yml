services:
  # ========================================================
  # SERVICE 1: EDGE GATEWAY & REVERSE PROXY (Nginx)
  # ========================================================
  devpulse-gateway:
    image: nginx:1.27-alpine
    container_name: devpulse-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-var:/var/www/certbot:ro
    depends_on:
      devpulse-backend:
        condition: service_healthy
      devpulse-frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devpulse-network
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 64M
        reservations:
          memory: 20M

  # ========================================================
  # SERVICE 2: FRONTEND SPA (React 18 + Vite Static Server)
  # ========================================================
  devpulse-frontend:
    image: dorayakiiiiz/devpulse-frontend:${IMAGE_TAG:-latest}
    container_name: devpulse-frontend
    restart: unless-stopped
    networks:
      - devpulse-network
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 64M
        reservations:
          memory: 20M

  # ========================================================
  # SERVICE 3: BACKEND API SERVICE (Node.js 20 Express)
  # ========================================================
  devpulse-backend:
    image: dorayakiiiiz/devpulse-backend:${IMAGE_TAG:-latest}
    container_name: devpulse-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      devpulse-database:
        condition: service_healthy
    networks:
      - devpulse-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

  # ========================================================
  # SERVICE 4: PERSISTENT DATABASE (MongoDB 7.0)
  # ========================================================
  devpulse-database:
    image: mongo:7.0
    container_name: devpulse-database
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodb_prod_data:/data/db
    networks:
      - devpulse-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 384M
        reservations:
          memory: 256M

networks:
  devpulse-network:

volumes:
  mongodb_prod_data:
  certbot-var:
